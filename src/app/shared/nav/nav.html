<nav class="navbar-hospedaje">
  <div class="nav-contenedor">

    <!-- Marca / Logo -->
    <a routerLink="/" class="marca">
      <img src="assets/logo.png" alt="Hospeda">
    </a>

    <!-- Botón Hamburguesa para Móviles -->
    <button class="menu-toggle" (click)="toggleMenu()" [attr.aria-expanded]="menuAbierto" aria-label="Abrir menú">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <!-- Contenedor desplegable (Menú + Acciones) -->
    <div class="menu-acciones-wrapper" [class.abierto]="menuAbierto">
      
      <!-- Menú central -->
      <div class="menu">
        <a routerLink="/" routerLinkActive="activo" [routerLinkActiveOptions]="{ exact: true }" (click)="cerrarMenu()">
          Inicio
        </a>
        <a routerLink="/alojamientos" routerLinkActive="activo" (click)="cerrarMenu()">
          Alojamientos
        </a>
        <a routerLink="/favoritos" routerLinkActive="activo" (click)="cerrarMenu()">
          Favoritos
        </a>
        <a routerLink="/sobrenosotros" routerLinkActive="activo" (click)="cerrarMenu()">
          Sobre nosotros
        </a>
        <a routerLink="/ayudacontacto" routerLinkActive="activo" (click)="cerrarMenu()">
          Ayuda y contacto
        </a>
      </div>

      <!-- Botones de la derecha -->
      <div class="acciones">
        <a routerLink="/inicio-sesion" class="iniciar" (click)="cerrarMenu()">
          Iniciar sesión
        </a>
        <a routerLink="/registrarse" class="registrar" (click)="cerrarMenu()">
          Registrarme
        </a>
      </div>

    </div>

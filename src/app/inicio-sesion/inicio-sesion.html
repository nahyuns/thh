<div class="contenedor-inicio">
<!-- lado izquierdo -->

  <div class="parte-imagen">
    <img src="assets/imagenIzquierdaInicio.jpg" alt="">
  </div>
<!-- Parte derecha -->
  <div class="parte-formulario">

    <div class="formulario">

      <!-- Logo -->
      <div class="logo">
        TH
      </div>

      <h1>Inicio de sesión</h1>

      <p class="subtitulo">
        Accedé a tu cuenta
      </p>
      

      <!-- Correo -->
      <div class="grupo-campo">
        <label for="correo">Correo electrónico</label>

        <input
          type="email"
          id="correo"
          placeholder="Ingresá tu correo electrónico"
        >
      </div>
         <!-- Contraseña -->
      <div class="grupo-campo">
        <label for="contrasena">Contraseña</label>

        <input
          type="password"
          id="contrasena"
          placeholder="Ingresá tu contraseña"
        >
      </div>
  <!-- Olvidé mi contraseña -->
      <div class="olvidaste">
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>

      <!-- Botón -->
      <button class="boton-iniciar">
        Iniciar sesión
      </button>

      <!-- Volver -->
      <button class="boton-volver">
        ← Volver al sitio
      </button>

      <!-- Registro -->
      <p class="registro">
        ¿No tenés una cuenta?
        <a href="#">Registrate</a>
      </p>

    </div>

  </div>

</div>
